name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (Linux, race detector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  go-macos:
    name: Go (macOS, race detector)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  desktop:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/universal
          - os: ubuntu-22.04
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Wails Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev xvfb

      - name: Build frontend assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Inject app version into wails.json
        shell: python
        run: |
          import json, sys
          with open('VERSION') as f:
              v = f.read().strip()
          pv = v[1:] if v.startswith('v') else v
          with open('wails.json') as f:
              w = json.load(f)
          w.setdefault('info', {})['productVersion'] = pv
          with open('wails.json', 'w') as f:
              json.dump(w, f, indent=2)
              f.write('\n')
          print(f"wails.json productVersion -> {pv}")

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build packaged binary
        run: wails build -clean -nopackage -s -platform ${{ matrix.platform }}

      - name: Generate build checksums
        shell: bash
        env:
          ARTIFACT_NAME: cortexos-${{ matrix.os }}
          ARTIFACT_PLATFORM: ${{ matrix.platform }}
        run: |
          chmod +x ./scripts/generate-checksums.sh
          ./scripts/generate-checksums.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortexos-${{ matrix.os }}
          path: |
            build/bin/cortexos*
          retention-days: 7

      - name: Packaged smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-wails-packaged.ps1 -SkipBuild -Output build/bin/cortexos.exe -TimeoutSeconds 180

      - name: Packaged smoke (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SKIP_BUILD: 'true'
          OUTPUT: build/bin/cortexos
        run: |
          chmod +x ./scripts/smoke-wails-packaged.sh
          ./scripts/smoke-wails-packaged.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
